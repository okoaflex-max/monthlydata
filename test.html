<!DOCTYPE html>
<html>
<head>
    <title>Airtel Test</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Airtel Test Page</h1>
        <button onclick="testPayment()" class="btn btn-primary">Test Payment Section</button>
        <div id="paymentSection" style="display: none; margin-top: 20px;" class="alert alert-success">
            <h3>Payment Section Working!</h3>
            <p>If you can see this, the payment logic works.</p>
        </div>
    </div>
    
    <script>
        function testPayment() {
            console.log('Test payment called');
            const paymentSection = document.getElementById('paymentSection');
            if (paymentSection) {
                paymentSection.style.display = 'block';
                console.log('Payment section should be visible');
            } else {
                console.error('Payment section not found');
            }
        }
    </script>
</body>
</html>
